name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: stable

      - run: dart pub get

      # The justfile wraps these same two commands. CI runs dart directly so a
      # green pipeline never depends on just being installed on the runner.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Install zizmor
        run: pip install zizmor==1.23.1

      - name: Run zizmor
        run: zizmor --format plain .github/

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: stable

      # The build hook downloads the pinned engine on a cold cache. Keying on
      # the generated pin means moving the pin misses the cache, which is
      # exactly what should happen.
      - name: Cache the pinned libhegel engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hegel-dart/natives
          key: >-
            libhegel-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('lib/src/libhegel/version.g.dart') }}

      - run: dart pub get

      - name: Test
        run: dart test
