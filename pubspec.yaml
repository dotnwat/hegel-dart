name: hegel
description: >-
  Property-based testing for Dart, powered by the Hegel engine: generation,
  shrinking, and replay of failing examples via native libhegel bindings.
version: 0.1.0-dev
repository: https://github.com/dotnwat/hegel-dart
issue_tracker: https://github.com/dotnwat/hegel-dart/issues
homepage: https://hegel.dev

environment:
  sdk: ^3.13.0

# The engine is a prebuilt binary, and hegel-rust publishes desktop builds
# only. Declaring this keeps the package off Android, iOS, and web, where it
# could never work rather than merely being untested.
platforms:
  linux:
  macos:
  windows:

dependencies:
  # Asset types for the build hook that ships libhegel (hook/build.dart).
  code_assets: ^2.0.0
  # SHA-256 verification of downloaded engine binaries; the SDK has no hashing.
  crypto: ^3.0.7
  # Pointers, arenas, and native string helpers for the bindings.
  ffi: ^2.2.0
  # Build-hook protocol.
  hooks: ^2.2.0
  # @internal / @visibleForTesting on the binding surface.
  meta: ^1.19.0
  # Parsing a failure's stack into frames, to name where it came from. Already
  # present through package:test; the house rule is that nothing is relied on
  # transitively.
  stack_trace: ^1.12.0
  # property() registers a package:test test, so the runner ships with one
  # rather than borrowing the caller's. Lower bound 1.31.0 for test()'s
  # location: parameter; the range stays wide because flutter_test pins
  # test_api exactly, and only one test release matches each Flutter stable.
  test: ^1.31.0
  # TestHandle.current, the sanctioned way to ask what test is running. The
  # package's own README calls it not for public use; hooks.dart is the part
  # that is, and it is the only seam that gives a property a stable identity
  # without macros.
  test_api: ^0.7.12

dev_dependencies:
  async: ^2.13.1
  coverage: ^1.15.1
  # Pinned exactly so drift-check diffs mean an intentional generator upgrade.
  # 20.1.1 rather than 21.x: ffigen 21 depends on code_assets ^1.1.0, which
  # conflicts with the ^2.0.0 the build hook needs.
  dartdoc: 9.0.9
  path: ^1.9.0
  ffigen: 20.1.1
  lints: ^6.1.0
