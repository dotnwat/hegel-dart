# ffigen configuration for the libhegel C ABI.
#
# Regenerate with `just regen`. The output is checked in so that a diff is
# reviewable and libclang is needed only to regenerate; CI re-runs this and
# fails on any difference.
name: LibhegelBindings
description: Raw FFI bindings to the libhegel C ABI.
output: 'lib/src/libhegel/bindings.g.dart'

headers:
  entry-points:
    - 'third_party/libhegel/hegel.h'
  include-directives:
    - '**/hegel.h'

# @Native declarations bound to the code asset the build hook publishes, so
# nothing in this package ever opens a DynamicLibrary by path.
ffi-native:
  asset-id: 'package:hegel/libhegel'

# The ABI deliberately takes uint32_t for every enum-valued parameter so an
# out-of-range value is an error rather than undefined behaviour. Generating
# Dart enums here would hide that; semantic enums live in the safe layer.
enums:
  as-int:
    include:
      - '.*'

# The header carries the ownership, threading, and lifetime rules. Keeping
# them on the generated declarations puts them where the safe layer is written.
comments:
  style: any
  length: full

# ffigen warns that the integer type behind a C enum is implementation-defined.
# It matters only for hegel_result_t and hegel_run_status_t, which appear as a
# return type and an out-parameter; every enum-valued *input* is uint32_t in the
# ABI already. cbindgen emits plain C enums whose values fit in int, which is
# 32-bit on all five published targets, and ffigen picks ffi.Int accordingly.
silence-enum-warning: true

preamble: |
  // GENERATED FILE. DO NOT EDIT.
  //
  // Generated by ffigen from third_party/libhegel/hegel.h. Regenerate with
  // `just regen` after moving the pin with tool/update_libhegel.dart.
